<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Заявка на кредит — демо</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, Segoe UI, Roboto, sans-serif;
      background: #0a1f44;
      min-height: 100vh; margin: 0;
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }
    .card {
      background: #fff; max-width: 440px; width: 100%;
      border-radius: 16px; padding: 32px;
      box-shadow: 0 20px 60px rgba(0,0,0,.4);
    }
    .badge {
      background: #e7f3ff; color: #0044cc;
      border-left: 4px solid #0055ff;
      padding: 10px 14px; border-radius: 6px;
      font-size: 13px; margin-bottom: 22px;
    }
    h1 { font-size: 22px; margin: 0 0 6px; color: #0a1f44; }
    .sub { color: #6b7280; font-size: 14px; margin-bottom: 22px; }
    label { font-size: 13px; color: #374151; font-weight: 600; }
    input, select {
      width: 100%; padding: 12px; margin: 6px 0 16px;
      border: 1px solid #d1d5db; border-radius: 8px;
      font-size: 15px; outline: none;
    }
    input:focus, select:focus { border-color: #0055ff; }
    button {
      width: 100%; padding: 14px;
      background: #0055ff; color: #fff;
      border: none; border-radius: 8px;
      font-size: 16px; font-weight: 600; cursor: pointer;
    }
    button:hover { background: #0044cc; }
    button:disabled { background: #93b4ff; cursor: not-allowed; }
    .msg { margin-top: 14px; font-size: 14px; text-align: center; }
    .ok { color: #059669; }
    .err { color: #dc2626; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Демонстрационная форма. Не является банком.</div>
    <h1>Заявка на кредит</h1>
    <p class="sub">Заполните форму — заявка уйдёт администратору.</p>

    <form id="form">
      <label>Ваш Telegram (username)</label>
      <input name="tg" placeholder="@username" required>

      <label>Имя</label>
      <input name="name" placeholder="Иван" required>

      <label>Сумма кредита, ₽</label>
      <input name="amount" type="number" min="1000" max="5000000" placeholder="100000" required>

      <label>Срок</label>
      <select name="term">
        <option value="1h">1 час</option>
        <option value="3h">3 часа</option>
        <option value="6h">6 часов</option>
        <option value="12h">12 часов</option>
        <option value="1d">1 день</option>
        <option value="2d">2 дня</option>
        <option value="3d">3 дня</option>
        <option value="5d">5 дней</option>
        <option value="7d">7 дней</option>
      </select>

      <button type="submit" id="btn">Отправить заявку</button>
    </form>
    <div id="msg" class="msg"></div>
  </div>

  <script>
    const form = document.getElementById('form');
    const btn  = document.getElementById('btn');
    const msg  = document.getElementById('msg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(form));
      btn.disabled = true;
      msg.textContent = 'Отправка...';
      msg.className = 'msg';

      try {
        const res = await fetch('/api/apply', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        const json = await res.json();
        if (res.ok) {
          msg.textContent = '✅ Заявка отправлена администратору';
          msg.className = 'msg ok';
          form.reset();
        } else {
          msg.textContent = json.error || 'Ошибка';
          msg.className = 'msg err';
        }
      } catch {
        msg.textContent = 'Сетевая ошибка';
        msg.className = 'msg err';
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
